services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes: [qdrant-data:/qdrant/storage]
    ports: ["127.0.0.1:6333:6333"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r line <&3; [[ $$line == *200* ]]'"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [{ path: .env, required: false }]
    environment:
      APP_ENV: production
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: sqlite:////app/data/app.db
      DOCUMENT_ROOT: /app/data/documents
      PAGE_CACHE_ROOT: /app/data/pages
      ARTIFACT_ROOT: /app/artifacts/evaluations
      HF_HOME: /models
    volumes: [api-data:/app/data, artifacts:/app/artifacts, models:/models]
    ports: ["127.0.0.1:8000:8000"]
    depends_on: { qdrant: { condition: service_healthy } }
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 180s
      retries: 30
  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["127.0.0.1:8080:8080"]
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  qdrant-data:
  api-data:
  artifacts:
  models:
