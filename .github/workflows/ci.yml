name: validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports: ['6333:6333']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: pip install uv==0.11.28
      - run: uv sync --locked
      - run: npm --prefix frontend ci
      - run: make lint
      - run: uv run pytest -m 'not live' --cov=backend/app --cov-report=json --cov-report=term-missing --cov-fail-under=85
        env: {TEST_QDRANT_URL: 'http://127.0.0.1:6333'}
      - run: uv run python scripts/check_coverage.py
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: docker compose -p rag-e2e -f docker-compose.yml -f compose.e2e.yml up -d --build --wait
      - run: cd frontend && npx playwright install --with-deps chromium && npm run test:e2e
      - if: always()
        run: docker compose -p rag-e2e -f docker-compose.yml -f compose.e2e.yml logs --no-color
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: frontend/test-results
          if-no-files-found: ignore
      - if: always()
        run: docker compose -p rag-e2e -f docker-compose.yml -f compose.e2e.yml down -v
