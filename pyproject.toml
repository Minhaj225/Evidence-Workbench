[project]
name = "evaluation-driven-rag"
version = "0.1.0"
description = "Single-node, evidence-grounded document retrieval and evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "pydantic-settings",
  "sqlalchemy",
  "alembic",
  "pymupdf",
  "syntok",
  "numpy",
  "qdrant-client",
  "google-genai",
  "langchain-google-genai",
  "python-multipart",
  "uvicorn",
  "httpx",
  "sentence-transformers",
  "torch",
  "ragas>=0.4",
  "langchain-community<0.4",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "hypothesis", "ruff", "mypy"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: requires a real Qdrant server", "live: opt-in hosted generation"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["backend/tests", "backend/alembic"]

